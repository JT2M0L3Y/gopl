name: Release

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write

jobs:
  performance:
    name: Measure merged PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Calculate next version
        id: version
        run: ./scripts/version.sh

      - name: Verify source
        uses: ./github/workflows/ci.yml

      - name: Run benchmarks
        run: ./scripts/benchmark.sh

      - name: Generate release profiles
        run: ./scripts/profile.sh

      - name: Build release binaries
        run: ./scripts/binary.sh

      - name: Create release report
        run: ./scripts/report.sh

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gopl-release-${{ steps.version.outputs.version }}
          path: |
            artifacts/
            dist/

  publish:
    name: Publish approved release
    needs: performance
    if: needs.performance.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.performance.outputs.merge_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: gopl-release-${{ needs.performance.outputs.version }}
          path: release

      - name: Create version tag
        run: ./scripts/tag.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.performance.outputs.version }}
          name: GoPL v${{ needs.performance.outputs.version }}
          body_path: release/artifacts/release-notes.md
          files: release/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
